name: Build SunamoPerformance

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build SunamoPerformance
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore SunamoPerformance/SunamoPerformance.csproj

    - name: Build
      run: dotnet build SunamoPerformance/SunamoPerformance.csproj --configuration Release --no-restore

  test:
    name: Test SunamoPerformance.Tests
    runs-on: ${{ matrix.os }}
    needs: build

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore SunamoPerformance.Tests/SunamoPerformance.Tests.csproj

    - name: Build tests
      run: dotnet build SunamoPerformance.Tests/SunamoPerformance.Tests.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test SunamoPerformance.Tests/SunamoPerformance.Tests.csproj --configuration Release --no-build --verbosity normal
      continue-on-error: true
